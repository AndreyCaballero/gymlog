<title>GymLog - Registro de Entrenamiento</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<style>
:root,[data-theme="prooscuro"]{--bg:#0E1013;--card:#171A1F;--tx:#F2F4F7;--mut:#8A93A0;--bd:#262B33;--in:#0E1013;--ac:#C6F432;--acT:#10130A;--ok:#2FBF71;--warn:#F5A623;--bad:#E5484D;--r:16px;--fh:Inter,system-ui,sans-serif;--hw:700;--sh:none}
[data-theme="editorial"]{--bg:#F4F1EA;--card:#FFFFFF;--tx:#1C1B19;--mut:#77736A;--bd:#E6E1D6;--in:#FAF8F3;--ac:#E4572E;--acT:#FFFFFF;--ok:#1F9D5A;--warn:#D98A00;--bad:#D6372F;--r:20px;--fh:Fraunces,Georgia,serif;--hw:600;--sh:0 2px 14px rgba(40,30,10,.08)}
:root{--acs:color-mix(in srgb,var(--ac) 16%,var(--card));--fb:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{width:100%;height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);margin:0;padding:14px;padding-bottom:170px;width:100%;min-height:100vh;overflow-x:hidden;font-size:17px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--fh);font-weight:var(--hw);letter-spacing:-.01em}
h1{font-size:30px;margin:6px 0 12px}h2{font-size:21px;margin:2px 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh);width:100%}
.row{display:flex;gap:8px;align-items:center;width:100%}.grow{flex:1}
input,select{font:inherit;font-size:17px;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:10px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--ac)}
button{font:600 16px var(--fb);border:0;border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--acs);color:var(--ac);width:100%;margin-top:6px;transition:transform .12s,background .2s,opacity .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active{transform:scale(.97)}
button.p{background:var(--ac);color:var(--acT)}
button.x{background:none;color:var(--mut);width:auto;padding:6px 10px;margin:0}
button.sm{width:auto;margin:0;padding:7px 12px;font-size:14px;background:var(--bd);color:var(--tx)}
button.sm.on{background:var(--ac);color:var(--acT)}
button.danger{background:none;border:1px solid var(--bad);color:var(--bad)}
.set-container{background:color-mix(in srgb,var(--tx) 4%,transparent);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:8px;transition:border-color .3s,background .3s}
.set-container.dn{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--card))}
.set-container.pop{animation:pop .45s ease}
.cap{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;font-size:12px;color:var(--mut);text-align:center;margin:6px 0 2px}
.set{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:center}
.sn{text-align:center;font-size:18px}
.stp{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;gap:4px;align-items:center}
.stp input{text-align:center;padding:9px 2px;font-size:18px;font-weight:600}
.stp input::placeholder{color:var(--mut);font-weight:400}
.sb{width:36px;height:42px;padding:0;margin:0;border-radius:10px;background:var(--bd);color:var(--tx)}
.set-foot{display:flex;align-items:center;gap:8px;margin-top:8px}
.set-foot .dbtn{width:auto;margin:0;padding:9px 16px;font-size:15px}
.dbtn.on{background:var(--ok);color:#fff}
.mu2{font-size:13px;color:var(--mut)}
.bdg{background:var(--ok);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.bdg:empty{display:none}
.bdg.pop{animation:pop .5s ease}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--acs);color:var(--ac);font-weight:600;white-space:nowrap}
.mini{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px 14px;margin-bottom:8px;font-size:16px;color:var(--mut);display:flex;align-items:center;gap:8px;cursor:pointer}
.mini.ok{color:var(--tx);border-left:4px solid var(--ok)}
.mini svg{color:var(--ok)}
.rest{background:var(--acs);border-radius:var(--r);padding:14px;margin:4px 0 10px;text-align:center;animation:fi .3s ease}
.rest .row{margin-top:2px}
.ringw{position:relative;width:190px;height:190px;margin:2px auto 10px}
.ringw svg{width:100%;height:100%}
.rg0{fill:none;stroke:color-mix(in srgb,var(--tx) 14%,transparent);stroke-width:9}
.rg1{fill:none;stroke:var(--ac);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .5s linear,stroke .3s}
.rest.low .rg1{stroke:var(--bad)}.rest.done .rg1{stroke:var(--ok)}
.rgt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rgt b{font-size:46px;line-height:1;font-family:var(--fh);font-weight:var(--hw)}
.rest.low .rgt b{color:var(--bad)}.rest.done .rgt b{color:var(--ok)}
.rgt span{font-size:14px;color:var(--mut);margin-top:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);z-index:100;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{position:relative;flex:1;flex-direction:column;gap:3px;border-radius:0;background:none;color:var(--mut);height:64px;margin:0;font-size:12px;font-weight:600}
.tabs button.on{color:var(--ac)}
.tabs button.on:after{content:'';position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}
#fab{position:fixed;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:150;display:none}
.pill{display:flex;align-items:center;gap:6px;white-space:nowrap;max-width:calc(100vw - 24px);background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:fi .25s ease}
.fmain{width:auto;margin:0;background:var(--ac);color:var(--acT);border-radius:999px;padding:12px 18px;font-size:16px;white-space:nowrap}
.fsec{width:46px;height:46px;margin:0;padding:0;border-radius:50%;flex:none}
.hint{color:var(--mut);font-size:14px;margin-bottom:6px}
.sug{color:var(--ac);font-size:15px;font-weight:600;margin:2px 0 8px}
.ex-row{display:flex;justify-content:space-between;align-items:center;gap:6px;border-bottom:1px solid var(--bd);padding:10px 4px;background:var(--card)}
.ex-row select{width:112px;font-size:14px;padding:6px}
.ex-row.sortable-ghost{opacity:.3;background:var(--acs)}
.drag-handle{display:flex;flex-direction:column;align-items:center;justify-content:center;width:36px;height:42px;cursor:grab;background:var(--acs);border-radius:8px;margin-right:6px;touch-action:none;flex:none}
.drag-handle span{width:4px;height:4px;background:var(--ac);border-radius:50%;margin:2px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mt{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.mt b{display:block;font-size:28px;font-family:var(--fh);font-weight:var(--hw)}
.bar{height:8px;border-radius:4px;background:var(--acs);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ac);transition:width .5s}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:15px;color:var(--mut)}
.cal div{height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px}
.cal .y{background:var(--ac);color:var(--acT)}
.cal .td{outline:2px solid var(--ac)}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--bd);font-size:16px;cursor:pointer}
.cfg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd);font-size:16px}
.cfg:first-of-type{border-top:0}
.cfg select,.cfg input{width:100px;font-size:15px;padding:8px}
.tg{width:46px;height:26px;border-radius:13px;background:var(--bd);position:relative;cursor:pointer;flex:none;transition:background .2s}
.tg span{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .18s}
.tg.on{background:var(--ac)}.tg.on span{left:23px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;flex:none}
.sw.a{border-color:var(--tx)}
.sec{font-size:12px;letter-spacing:.8px;color:var(--mut);margin:0 0 6px;font-weight:700}
.gear{width:auto;margin:0;padding:4px;background:none;color:var(--tx)}
.gear.on{color:var(--ac)}
.gear svg{width:26px;height:26px}
#topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--acT);padding:10px 20px;border-radius:20px;font-weight:600;font-size:15px;box-shadow:0 4px 15px rgba(0,0,0,.35);z-index:3000;display:none;max-width:90%;text-align:center}
#modal-overlay,#custom-confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px}
svg{max-width:100%}
#app.fade{animation:fi .28s ease}
#splash{position:fixed;inset:0;z-index:5000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .45s}
#splash.hide{opacity:0;pointer-events:none}
.logo{position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center;color:var(--ac)}
.logo svg{transform:rotate(-45deg)}
.logo:before,.logo:after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--ac);animation:pu 1.8s ease-out infinite}
.logo:after{animation-delay:.9s}
.sname{font-family:var(--fh);font-weight:var(--hw);font-size:30px;margin:0;letter-spacing:-.01em}
.sbar{position:relative;width:150px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--tx) 12%,transparent);overflow:hidden}
.sbar i{position:absolute;top:0;width:40%;height:100%;background:var(--ac);border-radius:2px;animation:sl 1.2s ease-in-out infinite}
.stx{font-size:13px;color:var(--mut)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.96)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes pu{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.6);opacity:0}}
@keyframes sl{0%{left:-40%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.set{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr)}
.set button,.set-cardio button{margin:0}
.set-cardio{display:grid;grid-template-columns:1fr 100px 44px 44px;gap:6px;align-items:center}
.set-rest-info{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-top:4px;padding-left:34px;min-height:22px}
.timer{display:flex;align-items:center;justify-content:space-between;background:var(--acs);color:var(--ac);padding:10px 14px;border-radius:12px;margin:8px 0;font-weight:700;font-size:17px}
.timer.hit{background:var(--ok);color:#fff}
.timer button{width:auto;margin:0;padding:6px 12px;background:var(--card);color:var(--tx);font-size:14px}
.ftm{padding:0 4px 0 10px;font-weight:700;font-size:15px;color:var(--ac);white-space:nowrap;flex:none}.ftm.hit{color:var(--ok)}.ftm.low{color:var(--bad)}
.ghost{width:auto;background:none;color:var(--mut);padding:6px 10px;margin:0;font-size:14px}
svg.ch{width:100%;height:auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:2px solid var(--bd);border-radius:14px;padding:10px;cursor:pointer;text-align:center;font-size:14px;font-weight:600;transition:border-color .2s}
.tile.a{border-color:var(--ac)}
.tile i{display:block;position:relative;overflow:hidden;height:44px;border-radius:8px;margin-bottom:6px}
.tile u{position:absolute;left:10px;bottom:8px;width:40%;height:8px;border-radius:4px}
.sw{flex:none}
/* compacto + modos + fuentes */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-size:15px;padding:12px;padding-bottom:160px}

.card{padding:13px;border-radius:14px}
input,select{font-size:15px;padding:8px 9px;border-radius:10px}
button{font-size:14px;padding:10px 12px;border-radius:10px}
.set{grid-template-columns:20px minmax(0,1fr) minmax(0,1fr);gap:6px}
.sn{font-size:15px}

.set-foot{gap:6px;flex-wrap:wrap}
.set-foot .dbtn{flex:1;width:auto;font-size:14px;padding:9px 10px;margin:0}

[data-theme="prooscuro"][data-mode="light"]{--bg:#F2F4F7;--card:#FFFFFF;--tx:#14181D;--mut:#68727F;--bd:#E0E4EA;--in:#F6F8FA;--ac:#5E8F00;--acT:#FFFFFF;--sh:0 2px 12px rgba(20,30,50,.07)}

.tile i.fnt{display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--in);border:1px solid var(--bd)}
.seg{display:flex;gap:8px}.seg button{margin:0;background:var(--bd);color:var(--tx)}.seg button.on{background:var(--ac);color:var(--acT)}
</style>

</head>

<script>
var SPREADSHEET_URL="https://docs.google.com/spreadsheets/d/1aO-NaV5SSNqQ3va2GSWIyRDnE3BtdmF7AXqViaNEoBg/edit";
var HAS_GS=typeof API_URL!=='undefined'&&String(API_URL).indexOf('script.google.com')>-1;
function api(fn,args){
  var ctl=typeof AbortController!=='undefined'?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort()},25000);
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:API_KEY,fn:fn,args:args}),signal:ctl?ctl.signal:undefined})
   .then(function(r){return r.json()}).then(function(j){clearTimeout(tm);if(!j.ok)throw new Error(j.error||'Error');return j.result},function(e){clearTimeout(tm);throw e});
}
var GS=(function(){
  var names=['getUserData','saveUserData','getLogs','appendLogsToSheet','deleteSession','deleteAllLogs','editSet','getMedidas','addMedida','getCatalogo'];
  function mk(ok,fail){var o={withSuccessHandler:function(f){return mk(f,fail)},withFailureHandler:function(f){return mk(ok,f)}};
    names.forEach(function(n){o[n]=function(){var a=[].slice.call(arguments);api(n,a).then(function(r){if(ok)ok(r)},function(e){if(fail)fail(e)})}});return o}
  return{run:mk()};
})();
var currentUser="",firstName="";
var GROUPS=['Espalda','Pecho','Hombros','Bíceps','Tríceps','Piernas','Glúteos','Pantorrillas','Core'];

function fmtT(n){return p2(Math.floor(n/60))+':'+p2(n%60)}

function guessMuscle(n){
  var s=String(n).toLowerCase(),R=[
   ['Cardio',/caminadora|el[ií]ptica|baile|escalera|bici|cardio|trote|correr/],
   ['Core',/abdom|rueda|\babs\b|plancha|core|crunch/],
   ['Tríceps',/tr[ií]ceps|copa|franc[eé]s|fondos/],
   ['Hombros',/hombro|militar|lateral|reverse|face ?pull|arnold/],
   ['Pantorrillas',/talones|pantorrilla|gemelo/],
   ['Glúteos',/gl[uú]teo|hip ?thrust/],

   ['Pecho',/press|peck|pecho|apertura|cruce|banca|fly/]];

function payload(){return JSON.stringify({routines:DATA.routines,restTimes:DATA.restTimes,ranges:DATA.ranges,muscles:DATA.muscles,settings:DATA.settings,theme:DATA.theme,collapsed:DATA.collapsed,accent:DATA.accent,mode:DATA.mode,font:DATA.font,zoom:DATA.zoom})}
function applyData(json){
  try{var d=JSON.parse(json);
    if(d.routines&&d.routines.length)DATA.routines=d.routines;
    if(d.restTimes)DATA.restTimes=d.restTimes;
    if(d.ranges)DATA.ranges=d.ranges;
    if(d.muscles)DATA.muscles=d.muscles;
    if(d.settings)DATA.settings=Object.assign({},DEFAULT_SETTINGS,d.settings);
    if(d.collapsed)DATA.collapsed=d.collapsed;
    if(d.theme)applyTheme(d.theme,true);
    if(d.accent!==undefined)DATA.accent=d.accent;
    if(d.mode!==undefined)DATA.mode=d.mode;
    if(d.font!==undefined)DATA.font=d.font;
    if(d.zoom)DATA.zoom=+d.zoom;
    applyUI();
  }catch(e){}
}

   .withFailureHandler(function(){setSync('⚠ Sin sincronizar (guardado local)')}).saveUserData(currentUser,pl);
}

function setPending(q){try{localStorage.setItem('gymlog_pend_'+currentUser,JSON.stringify(q))}catch(e){}}
function queue(rows,log){var q=getPending();q.push({rows:rows,log:log});setPending(q)}
function flushPending(cb){
  var q=getPending();if(!q.length||!HAS_GS)return cb();
  GS.run.withSuccessHandler(function(){q.shift();setPending(q);flushPending(cb)}).withFailureHandler(function(){cb()}).appendLogsToSheet(q[0].rows,currentUser);
}
function sendRows(rows,log){
  if(!HAS_GS){queue(rows,log);return}
  GS.run.withSuccessHandler(function(){setSync('☁ Sincronizado')}).withFailureHandler(function(){queue(rows,log);setSync('⚠ Pendiente de enviar a Sheets')}).appendLogsToSheet(rows,currentUser);
}
function loadLogs(limit,cb){
  function done(){getPending().forEach(function(p){if(!DATA.logs.some(function(l){return l.id===p.log.id}))DATA.logs.push(p.log)});cacheLogs();if(cb)cb()}
  try{var c=JSON.parse(localStorage.getItem('gymlog_logs_'+currentUser));if(c&&!DATA.logs.length)DATA.logs=c}catch(e){}
  if(!HAS_GS){done();return}
  GS.run.withSuccessHandler(function(j){
    try{DATA.logs=JSON.parse(j);DATA.fullLoaded=!limit||DATA.logs.length<limit}catch(e){}
    done();
  }).withFailureHandler(function(e){setSync('⚠ '+((e&&e.message)||'Sin conexión'));done()}).getLogs(currentUser,limit);
}

  try{var c=JSON.parse(localStorage.getItem('gymlog_body_'+currentUser));if(c)DATA.body=c}catch(e){}

  }).withFailureHandler(function(){setSync('⚠ Sin conexión (datos locales)');loadLogs(90,finishLoad)}).getUserData(u);
}

function weekStart(off){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);return d}
function weekStats(off){
  var s=weekStart(off),e=new Date(s);e.setDate(e.getDate()+7);
  var a=fmtD(s),b=fmtD(e),w={start:s,end:new Date(e.getTime()-86400000),sess:[],sets:{},days:{}};
  w.sess=DATA.logs.filter(function(l){return l.date>=a&&l.date<b}).sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:0});
  w.sess.forEach(function(l){l.entries.forEach(function(en){
    var m=muscleOf(en.name);if(MAIN.indexOf(m)<0)return;
    var n=en.sets.length;
    w.sets[m]=(w.sets[m]||0)+n;(w.days[m]=w.days[m]||{})[l.date]=1;
    var c=CAT[en.name];if(c)c.sec.forEach(function(g){if(g!==m&&MAIN.indexOf(g)>-1)w.sets[g]=(w.sets[g]||0)+n*0.5});
  })});
  return w;
}
function weekCount(off){return weekStats(off).sess.length}
function streak(){
  var g=DATA.settings.goal,c=weekCount(0)>=g?1:0;
  for(var o=-1;o>-80;o--){if(weekCount(o)>=g)c++;else break}
  return c;
}
function daysOf(w,m){return w.days[m]?Object.keys(w.days[m]).length:0}
function recommend(w,need){
  var best=null,lastR=w.sess.length?w.sess[w.sess.length-1].routine:'';
  DATA.routines.forEach(function(r){
    if(isCardio(r)||!r.ex.length)return;
    var ms={},sc=0;r.ex.forEach(function(e){var m=muscleOf(e);if(MAIN.indexOf(m)>-1&&!ms[m]){ms[m]=1;sc+=need[m]}});
    if(r.name===lastR)sc-=0.5;
    if(!best||sc>best.sc)best={r:r,sc:sc,ms:Object.keys(ms).filter(function(m){return need[m]>0})};
  });
  return best;
}
function lastSets(name){
  for(var i=DATA.logs.length-1;i>=0;i--){
    var e=DATA.logs[i].entries.filter(function(x){return x.name===name})[0];
    if(e&&e.sets.length)return e.sets;
  }
  return null;
}
function suggestion(name){
  var ls=lastSets(name);if(!ls||ls[0].minutes)return null;
  var rg=rangeFor(name),inc=incFor(name),ws=ls.map(function(s){return +s.w||0});
  if(isAsist(name)){
    var lo=Math.min.apply(null,ws),atLo=ls.filter(function(s){return(+s.w||0)===lo}),mr=Math.min.apply(null,atLo.map(function(s){return +s.r}));
    if(mr>=rg[1]&&lo>0){var nw=round1(Math.max(0,lo-inc));return{w:nw,txt:'⬇ Baja la asistencia a '+nw+' kg × '+rg[0]+'+'}}
    return{w:lo,txt:'🎯 Meta: '+lo+' kg de asistencia × '+(mr+1)+' reps en todas las series'};
  }
  var top=Math.max.apply(null,ws),atTop=ls.filter(function(s){return(+s.w||0)===top}),minR=Math.min.apply(null,atTop.map(function(s){return +s.r}));
  if(isBW(name)&&!(top>0))return minR>=rg[1]?{w:'',txt:'💪 Dominas el rango: añade peso o más reps'}:{w:'',txt:'🎯 Meta: '+(minR+1)+' reps en todas las series'};
  if(minR>=rg[1])return{w:round1(top+inc),txt:'⬆ Sube a '+round1(top+inc)+' kg × '+rg[0]+'+'};
  return{w:top,txt:'🎯 Meta: '+top+' kg × '+(minR+1)+' reps en todas las series'};
}
function bestPrev(name){
  var w=0,e=0;
  DATA.logs.forEach(function(l){l.entries.forEach(function(x){if(x.name!==name)return;
    x.sets.forEach(function(s){if(s.minutes)return;w=Math.max(w,+s.w);e=Math.max(e,e1rm(+s.w,+s.r))})})});
  return{w:w,e:e};
}
function badgeHtml(name,j,s,cardio){
  var ls=lastSets(name);if(!ls)return'';
  var p=ls[Math.min(j,ls.length-1)];
  if(cardio){var m=parseFloat(s.minutes),pm=parseFloat(p.minutes);return(m>0&&pm>0&&m>pm)?'▲ +'+round1(m-pm)+' min':''}
  var bw=isBW(name),asi=isAsist(name),w=parseFloat(s.w),r=parseInt(s.r),pw=parseFloat(p.w),pr=parseInt(p.r),parts=[];
  if(isNaN(pr))return'';
  if(isNaN(pw)){if(!bw)return'';pw=0}
  var hasW=s.w!==''&&s.w!=null&&!isNaN(w),hasR=s.r!==''&&s.r!=null&&!isNaN(r);
  if(!hasW&&bw){w=0}
  if(asi){
    if(hasW&&w<pw)parts.push('−'+round1(pw-w)+' kg asist.');
    if(hasW&&hasR&&w<=pw&&r>pr)parts.push('+'+(r-pr)+(r-pr>1?' reps':' rep'));
  }else{
    if(hasW&&w>pw)parts.push('+'+round1(w-pw)+' kg');
    if((hasW||bw)&&hasR&&w>=pw&&r>pr)parts.push('+'+(r-pr)+(r-pr>1?' reps':' rep'));
  }
  return parts.length?'▲ '+parts.join(' · '):'';
}
function pointsFor(name,metric){
  var pts=[],asi=isAsist(name);
  DATA.logs.forEach(function(l){l.entries.forEach(function(e){if(e.name!==name)return;
    var v=0,mn=1e9;
    e.sets.forEach(function(s){
      if(s.minutes){v+=parseFloat(s.minutes);return}
      var w=+s.w,r=+s.r;
      if(isBW(name)&&!(w>0)){v=metric==='vol'?v+r:Math.max(v,r);return}
      if(metric==='w'){if(asi){if(w>0)mn=Math.min(mn,w)}else v=Math.max(v,w)}
      else if(metric==='vol')v+=w*r;else v=Math.max(v,e1rm(w,r));
    });
    if(asi&&metric==='w'&&mn<1e9)v=mn;
    if(v>0)pts.push({date:l.date.slice(5),val:round1(v)});
  })});
  return pts;
}
function getAllEx(){var s=new Set();DATA.routines.forEach(function(r){r.ex.forEach(function(e){s.add(e)})});DATA.logs.forEach(function(l){l.entries.forEach(function(e){s.add(e.name)})});return Array.from(s).sort()}

/* ---------- sonido, vibración, pantalla ---------- */
var AC=null,WL=null;
function initAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(){if(!AC)return;try{[0,.25,.5].forEach(function(t){var o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;g.gain.value=.2;o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.15)})}catch(e){}}
function wakeOn(){if(!DATA.settings.wake||!navigator.wakeLock)return;try{navigator.wakeLock.request('screen').then(function(l){WL=l}).catch(function(){})}catch(e){}}
function wakeOff(){if(WL){try{WL.release()}catch(e){}WL=null}}
function buzz(p){try{if(DATA.settings.vibrate&&navigator.vibrate)navigator.vibrate(p)}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden){tickAll();if(DATA.inSession)wakeOn()}});

/* ---------- temporizadores (hora real) ---------- */
function sessSecs(){return Math.max(0,Math.floor((Date.now()-DATA.sessionStart)/1000))}
function startTimer(i,j,target){
  stopTimer(true);
  DATA.timer={exIdx:i,setIdx:j,target:target||90,start:Date.now(),fired:false};
  render();
}
function stopTimer(silent){
  var T=DATA.timer;
  if(T){var el=Math.floor((Date.now()-T.start)/1000);if(DATA.draft[T.exIdx]&&DATA.draft[T.exIdx][T.setIdx])DATA.draft[T.exIdx][T.setIdx].restSec=el;DATA.timer=null}
  if(!silent)render();
}
function tickAll(){
  var S=DATA.settings;
  if(DATA.inSession){
    var secs=sessSecs(),se=document.getElementById('session-time');if(se)se.textContent=fmtT(secs);
    if(S.alertOn&&!DATA.alerted&&secs>=S.alertMin*60){DATA.alerted=true;showToast('⏱ Llevas '+S.alertMin+' min entrenando',6000);buzz([300,150,300])}
  }
  var T=DATA.timer;if(!T)return;
  var st=ringState(T);
  if(DATA.draft[T.exIdx]&&DATA.draft[T.exIdx][T.setIdx])DATA.draft[T.exIdx][T.setIdx].restSec=Math.floor((Date.now()-T.start)/1000);
  var box=document.getElementById('tm-box'),arc=document.getElementById('rg-arc'),num=document.getElementById('rg-num'),sub=document.getElementById('rg-sub'),f=document.getElementById('fab-t');
  if(box){box.classList.toggle('low',st.low);box.classList.toggle('done',st.hit)}
  if(arc)arc.setAttribute('stroke-dashoffset',st.off);
  if(num)num.textContent=st.num;
  if(sub)sub.textContent=st.sub;
  if(f){f.textContent=st.hit?'✓ Listo':'⏱ '+fmtR(st.rem);f.classList.toggle('hit',st.hit);f.classList.toggle('low',st.low)}
  if(st.hit&&!T.fired){T.fired=true;if(S.sound)beep();buzz([200,100,200]);showToast('✅ Descanso terminado')}
}
setInterval(tickAll,500);

/* ---------- borrador de la sesión ---------- */
function initDraft(){
  var r=DATA.routines[DATA.rid];if(!r)return;
  DATA.draft=r.ex.map(function(){return[isCardio(r)?{minutes:'',done:false}:{w:'',r:'',done:false,restSec:0}]});
  DATA.active=0;
}
function setVal(i,j,k,v){
  DATA.draft[i][j][k]=v;saveDraft();
  var el=document.getElementById('bd-'+i+'-'+j);
  if(el){var r=DATA.routines[DATA.rid],b=badgeHtml(r.ex[i],j,DATA.draft[i][j],isCardio(r));
    if(el.textContent!==b){el.textContent=b;el.classList.remove('pop');if(b){void el.offsetWidth;el.classList.add('pop')}}}
}
function toggleSet(i,j){
  initAudio();var s=DATA.draft[i][j],T=DATA.timer;
  if(T&&T.exIdx===i&&T.setIdx===j){stopTimer();return}
  s.done=!s.done;
  if(s.done){DATA.pop=i+'-'+j;buzz(30);startTimer(i,j,restFor(DATA.routines[DATA.rid].ex[i]));
    setTimeout(function(){var b=document.getElementById('tm-box');if(b&&b.scrollIntoView)b.scrollIntoView({behavior:'smooth',block:'center'})},90)}
  else{stopTimer(true);render()}
}
var RC=439.8;
function ringState(T){
  var el=Math.floor((Date.now()-T.start)/1000),rem=T.target-el,hit=rem<=0,low=!hit&&rem<15;
  return{rem:rem,hit:hit,low:low,off:hit?0:(RC*(1-rem/T.target)).toFixed(1),num:hit?'Listo':fmtR(rem),sub:hit?'+'+fmtR(-rem)+' extra':'Descanso · serie '+(T.setIdx+1)};
}
function restHtml(T,last){
  var st=ringState(T);
  return'<div class="rest'+(st.low?' low':'')+(st.hit?' done':'')+'" id="tm-box"><div class="ringw"><svg viewBox="0 0 160 160"><circle class="rg0" cx="80" cy="80" r="70"/><circle class="rg1" id="rg-arc" cx="80" cy="80" r="70" transform="rotate(-90 80 80)" stroke-dasharray="439.8" stroke-dashoffset="'+st.off+'"/></svg><div class="rgt"><b id="rg-num">'+st.num+'</b><span id="rg-sub">'+st.sub+'</span></div></div><button class="p" style="margin:0 0 8px" onclick="nextSet()">'+ic('plus',18)+'Siguiente serie</button><button style="margin:0" onclick="nextEx()">'+(last?'Guardar sesión':'Siguiente ejercicio')+ic('next',18)+'</button></div>';
}
function stepper(k,i,j,val,ph,inm){
  return'<div class="stp"><button class="sb" aria-label="Menos" onclick="step('+i+','+j+',\''+k+'\',-1)">'+ic('minus',18)+'</button><input id="in-'+k+'-'+i+'-'+j+'" type="number" inputmode="'+inm+'" placeholder="'+ph+'" value="'+esc(val)+'" oninput="setVal('+i+','+j+',\''+k+'\',this.value)"><button class="sb" aria-label="Más" onclick="step('+i+','+j+',\''+k+'\',1)">'+ic('plus',18)+'</button></div>';
}
function step(i,j,k,dir){
  var n=DATA.routines[DATA.rid].ex[i],s=DATA.draft[i][j],v=parseFloat(String(s[k]).replace(',','.')),amt=k==='w'?incFor(n):(k==='minutes'?5:1);
  if(isNaN(v)){
    var ls=lastSets(n),p=ls&&ls[Math.min(j,ls.length-1)],sg=k==='w'?suggestion(n):null,base=0;
    if(k==='w')base=sg&&+sg.w>0?+sg.w:(p&&+p.w>0?+p.w:0);else if(k==='r')base=p&&+p.r>0?+p.r:0;
    v=base;if(base>0)amt=0;
  }
  v=Math.max(0,Math.round((v+dir*amt)*100)/100);
  var el=document.getElementById('in-'+k+'-'+i+'-'+j);if(el)el.value=v;
  setVal(i,j,k,String(v));buzz(10);
}
function scrollSet(i,j){setTimeout(function(){var e=document.getElementById('sc-'+i+'-'+j);if(e&&e.scrollIntoView)e.scrollIntoView({behavior:'smooth',block:'center'})},60)}
function nextSet(){
  var T=DATA.timer;if(!T)return;var i=T.exIdx,j=T.setIdx;stopTimer(true);
  if(j+1>=DATA.draft[i].length)addSet(i);else render();
  scrollSet(i,j+1);
}
function nextEx(){stopTimer(true);fabNext()}
function toggleCardio(i,j){DATA.draft[i][j].done=!DATA.draft[i][j].done;render()}
function addSet(i){
  var d=DATA.draft[i],prev=d[d.length-1];
  d.push(prev&&prev.w!==undefined?{w:prev.w,r:'',done:false,restSec:0}:{minutes:'',done:false});
  render();
}
function delSet(i,j){stopTimer(true);DATA.draft[i].splice(j,1);if(!DATA.draft[i].length)addSet(i);else render()}
function setRest(i,v){DATA.restTimes[DATA.routines[DATA.rid].ex[i]]=parseInt(v);saveCloud()}
function setRange(i,k,v){
  var n=DATA.routines[DATA.rid].ex[i],rg=rangeFor(n).slice();rg[k]=parseInt(v)||rg[k];
  DATA.ranges[n]=rg;saveCloud();render();
}
function setActive(i){
  DATA.active=i;stopTimer(true);saveDraft();render();
  var e=document.getElementById('ex-active');if(e&&e.scrollIntoView)e.scrollIntoView({behavior:'smooth',block:'start'});
}
function fabNext(){
  var r=DATA.routines[DATA.rid];
  if(DATA.active>=r.ex.length-1)saveSession();else setActive(DATA.active+1);
}
function copyLast(i,quiet){
  var n=DATA.routines[DATA.rid].ex[i],ls=lastSets(n);if(!ls)return;
  var sg=suggestion(n);
  DATA.draft[i]=ls.map(function(s){return s.minutes?{minutes:s.minutes,done:false}:{w:(sg?sg.w:s.w),r:'',done:false,restSec:0}});
  if(!quiet){saveDraft();render()}
}
function repeatLast(){
  var r=DATA.routines[DATA.rid];
  r.ex.forEach(function(n,i){copyLast(i,true)});
  saveDraft();render();showToast('Series de la última sesión cargadas');
}
function repeatLog(k){
  var l=DATA.logs[k],ri=-1;
  DATA.routines.forEach(function(r,i){if(r.name===l.routine)ri=i});
  if(ri<0){showToast('Esa rutina ya no existe');return}
  if(DATA.inSession){showToast('Termina la sesión actual primero');return}
  DATA.rid=ri;DATA.tab='t';startSession();
  var r=DATA.routines[ri];
  l.entries.forEach(function(en){var i=r.ex.indexOf(en.name);if(i<0)return;
    DATA.draft[i]=en.sets.map(function(s){return s.minutes?{minutes:s.minutes,done:false}:{w:s.w,r:'',done:false,restSec:0}})});
  saveDraft();render();
}
function startSession(){
  DATA.inSession=true;DATA.sessionStart=Date.now();DATA.alerted=false;
  initDraft();initAudio();wakeOn();saveDraft();render();
}
function endSession(){
  showConfirm('Terminar sesión','Se descartarán los datos no guardados. ¿Continuar?',function(){
    DATA.inSession=false;stopTimer(true);wakeOff();clearDraft();render();
  });
}

/* ---------- navegación ---------- */
function setTab(t){DATA.tab=t;render()}
function toggleSettings(){
  if(DATA.tab==='a')DATA.tab=DATA.prevTab||'t';else{DATA.prevTab=DATA.tab;DATA.tab='a'}
  render();
}
function render(){
  var T=[['t','Entrenar','train'],['r','Rutinas','routine'],['p','Progreso','chart'],['h','Historial','hist']];
  document.getElementById('nav').innerHTML=T.map(function(x){return'<button class="'+(DATA.tab===x[0]?'on':'')+'" onclick="setTab(\''+x[0]+'\')">'+ic(x[2],22)+'<span>'+x[1]+'</span></button>'}).join('');
  document.getElementById('gearbtn').className='gear'+(DATA.tab==='a'?' on':'');
  var app=document.getElementById('app');
  app.className=DATA.lastTab!==DATA.tab?'fade':'';DATA.lastTab=DATA.tab;
  if(DATA.tab==='t')app.innerHTML=viewTrain();
  else if(DATA.tab==='r'){app.innerHTML=viewRoutines();DATA.routines.forEach(function(r,i){if(!DATA.collapsed[r.name])initDragAndDrop(i)})}
  else if(DATA.tab==='p')app.innerHTML=viewProgress();
  else if(DATA.tab==='h')app.innerHTML=viewHistory();
  else app.innerHTML=viewSettings();
  DATA.pop='';renderFab();
  if(DATA.inSession)saveDraft();
}
function renderFab(){
  var f=document.getElementById('fab'),r=DATA.routines[DATA.rid];
  if(DATA.tab!=='t'||!DATA.inSession||!r||!r.ex.length){f.style.display='none';return}
  var i=DATA.active,d=DATA.draft[i]||[],cardio=isCardio(r),last=i>=r.ex.length-1,doneN=d.filter(function(s){return s.done}).length;
  var wantNext=cardio||(d.length>0&&doneN===d.length&&doneN>=3);
  var nextLbl=last?'Guardar sesión':'Siguiente →',main,alt=null;
  if(cardio){main=['+ Añadir serie','addSet('+i+')'];alt=['✓','saveSession()','Guardar sesión']}
  else if(wantNext){main=[nextLbl,'fabNext()'];alt=['+','addSet('+i+')','Añadir serie']}
  else{main=['+ Añadir serie','addSet('+i+')'];alt=[last?'✓':'→','fabNext()',last?'Guardar sesión':'Siguiente ejercicio']}
  f.innerHTML='<div class="pill">'+(DATA.timer?'<span class="ftm" id="fab-t">⏱ '+fmtR(Math.max(0,ringState(DATA.timer).rem))+'</span>':'')+'<button class="fmain" onclick="'+main[1]+'">'+main[0]+'</button>'+(alt?'<button class="fsec" aria-label="'+alt[2]+'" onclick="'+alt[1]+'">'+alt[0]+'</button>':'')+'</div>';
  f.style.display='block';

function initDragAndDrop(rIdx){
  var c=document.getElementById('exercises-list-'+rIdx);if(!c||typeof Sortable==='undefined')return;
  Sortable.create(c,{handle:'.drag-handle',animation:150,forceFallback:true,onEnd:function(ev){
    stopTimer(true);var ex=DATA.routines[rIdx].ex,m=ex.splice(ev.oldIndex,1)[0];ex.splice(ev.newIndex,0,m);
    saveCloud();if(DATA.rid===rIdx&&!DATA.inSession)initDraft();render();
  }});
}

/* ---------- vista: Entrenar ---------- */
function goalCard(){
  var n=weekCount(0),g=DATA.settings.goal;
  return'<div class="card"><div class="row" style="justify-content:space-between"><b>Meta semanal</b><span style="color:var(--ac);font-weight:700">'+n+' de '+g+'</span></div><div class="bar"><i style="width:'+Math.min(100,Math.round(n/g*100))+'%"></i></div></div>';
}
function miniText(n,i,cardio,d,done){
  if(done){
    if(cardio){var m=0;d.forEach(function(s){if(s.done)m+=parseFloat(s.minutes)||0});return'✓ '+esc(n)+': '+round1(m)+' min'}
    var mx=0;d.forEach(function(s){if(s.done)mx=Math.max(mx,parseFloat(s.w)||0)});
    return'✓ '+esc(n)+': '+done+(done>1?' series completadas':' serie completada')+' (máx '+mx+' kg)';
  }
  return i<DATA.active?'– '+esc(n)+': sin series':'○ '+esc(n)+' · pendiente';
}
function viewTrain(){
  if(!DATA.inSession){
    var o=DATA.routines.map(function(r,i){return'<option value="'+i+'"'+(i===DATA.rid?' selected':'')+'>'+esc(r.name)+'</option>'}).join('');
    return'<h1>¡Hola, '+esc(firstName)+'! 💪</h1>'+goalCard()+'<div class="card"><h2>¿Qué vamos a entrenar hoy?</h2><div class="row" style="margin:12px 0"><select class="grow" onchange="DATA.rid=parseInt(this.value);initDraft()">'+o+'</select></div><button class="p" onclick="startSession()">'+ic('play',18)+'Iniciar entrenamiento</button></div>';
  }
  var r=DATA.routines[DATA.rid];if(!r)return'<div class="card">Selecciona una rutina válida.</div>';
  var cardio=isCardio(r);if(DATA.draft.length!==r.ex.length)initDraft();
  if(DATA.active>=r.ex.length)DATA.active=0;
  var hasLast=DATA.logs.some(function(l){return l.routine===r.name});
  var h='<h1>'+esc(r.name)+'</h1><div class="card"><div class="row" style="justify-content:space-between"><b style="color:var(--ac)">⏱ <span id="session-time">'+fmtT(sessSecs())+'</span></b><button class="sm" onclick="endSession()">Terminar / Cambiar</button></div><div class="row" style="margin-top:8px"><input type="date" value="'+DATA.date+'" class="grow" onchange="DATA.date=this.value;saveDraft()"></div>'+(hasLast?'<button onclick="repeatLast()">↻ Repetir entrenamiento anterior</button>':'')+'</div>';
  if(cardio)h+='<div class="card"><p class="sec">ELIGE EL CARDIO DE HOY</p><div class="row" style="flex-wrap:wrap;gap:8px">'+r.ex.map(function(n,i){return'<button class="sm'+(i===DATA.active?' on':'')+'" onclick="setActive('+i+')">'+esc(n)+'</button>'}).join('')+'</div></div>';
  r.ex.forEach(function(n,i){
    var d=DATA.draft[i]||[],done=d.filter(function(s){return s.done}).length;
    if(cardio&&i!==DATA.active)return;
    if(i!==DATA.active){h+='<div class="mini'+(done?' ok':'')+'" onclick="setActive('+i+')">'+miniText(n,i,cardio,d,done)+'</div>';return}
    var rest=restFor(n),rg=rangeFor(n),ls=lastSets(n),sg=suggestion(n),T=DATA.timer;
    h+='<div class="card" id="ex-active"><div class="row"><h2 class="grow">'+esc(n)+'</h2>';
    if(!cardio)h+='<select style="width:92px" onchange="setRest('+i+',this.value)">'+[45,60,90,120,180].map(function(v){return'<option value="'+v+'"'+(v===rest?' selected':'')+'>'+v+'s</option>'}).join('')+'</select>';

/* ---------- vista: Progreso ---------- */
function viewProgress(){
  var S=DATA.settings,off=DATA.weekOff,w=weekStats(off),n0=weekCount(0);
  var h='<h1>Progreso</h1><div class="g2"><div class="mt"><p class="hint" style="margin:0">Meta semanal</p><b>'+n0+' de '+S.goal+'</b><div class="bar"><i style="width:'+Math.min(100,Math.round(n0/S.goal*100))+'%"></i></div></div><div class="mt"><p class="hint" style="margin:0">Racha</p><b>'+streak()+' sem</b><p class="hint" style="margin:4px 0 0">cumpliendo la meta</p></div></div>';
  /* análisis semanal */
  var trained=MAIN.filter(function(m){return w.sets[m]>0}),tot=0;
  trained.forEach(function(m){tot+=w.sets[m]});
  var avg=trained.length?tot/trained.length:0,inten=avg<6?'baja':avg<10?'moderada':avg<=16?'alta':'muy alta';
  var need={};MAIN.forEach(function(m){need[m]=Math.max(0,2-daysOf(w,m))});
  var multi=trained.filter(function(m){return daysOf(w,m)>=2}).length,n=w.sess.length;
  var freq=n>=S.goal?'cumplida':'por debajo de la meta';
  h+='<div class="card"><h2>Análisis de la semana</h2><div class="hint">'+shortD(w.start)+' – '+shortD(w.end)+' · lunes a domingo</div><div class="row" style="margin-bottom:8px"><button class="sm'+(off===0?' on':'')+'" onclick="DATA.weekOff=0;render()">Esta semana</button><button class="sm'+(off===-1?' on':'')+'" onclick="DATA.weekOff=-1;render()">Semana pasada</button></div>';
  if(!n)h+='<p style="font-size:17px;margin:6px 0">Aún no hay entrenamientos registrados en esta semana.</p>';
  else{
    h+='<p style="font-size:17px;margin:6px 0;line-height:1.35">Entrenaste <b>'+trained.length+' de '+MAIN.length+' músculos</b> ('+(trained.join(', ')||'ninguno')+') con una intensidad <b>'+inten+'</b> ('+round1(avg)+' series por músculo) y una frecuencia <b>'+freq+'</b> ('+n+' de '+S.goal+' sesiones; '+multi+(multi===1?' músculo':' músculos')+' con 2 o más días).</p>';
    var rc=recommend(w,need);
    if(rc){
      var lack=MAIN.filter(function(m){return need[m]>0});
      h+='<p style="font-size:17px;margin:8px 0 0;line-height:1.35">Para la próxima semana te recomiendo empezar con la rutina <b style="color:var(--ac)">'+esc(rc.r.name)+'</b> '+(lack.length?'para garantizar una frecuencia correcta en todos los músculos (hoy les faltan días a: '+lack.join(', ')+').':'para mantener la frecuencia en todos los músculos.')+'</p>';
    }
  }
  h+='</div>';
  /* calendario */
  var now=new Date(),first=new Date(now.getFullYear(),now.getMonth()+DATA.calOff,1),dim=new Date(first.getFullYear(),first.getMonth()+1,0).getDate(),lead=(first.getDay()+6)%7;
  var set={},cnt=0,pre=first.getFullYear()+'-'+p2(first.getMonth()+1)+'-';
  DATA.logs.forEach(function(l){if(l.date.indexOf(pre)===0){if(!set[l.date])cnt++;set[l.date]=1}});
  h+='<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><button class="x" onclick="DATA.calOff--;render()">‹</button><b>'+MESL[first.getMonth()]+' '+first.getFullYear()+' · '+cnt+' días</b><button class="x" onclick="DATA.calOff++;render()">›</button></div><div class="cal">';
  'LMXJVSD'.split('').forEach(function(c){h+='<div>'+c+'</div>'});
  for(var k=0;k<lead;k++)h+='<div></div>';
  for(var d=1;d<=dim;d++){var ds=pre+p2(d);h+='<div class="'+(set[ds]?'y':'')+(ds===today()?' td':'')+'">'+d+'</div>'}
  h+='</div></div>';
  /* volumen por músculo */
  h+='<div class="card"><h2>Series por músculo</h2><div class="hint">'+(off===0?'Esta semana':'Semana pasada')+' · meta de 10 a 16 series efectivas (principal 1, secundario ½)</div>';
  MAIN.forEach(function(m){var v=w.sets[m]||0;h+='<div class="row" style="margin:7px 0"><span style="width:96px;font-size:14px">'+m+'</span><div class="bar" style="flex:1;margin:0"><i style="width:'+Math.min(100,Math.round(v/16*100))+'%;background:'+(v<10?'var(--warn)':'var(--ac)')+'"></i></div><span style="width:34px;text-align:right;font-size:14px">'+round1(v)+'</span></div>'});
  h+='<div class="hint" style="margin-top:6px">En ámbar: por debajo de la meta</div></div>';
  /* gráfica por ejercicio */
  var all=getAllEx().filter(function(x){return DATA.logs.some(function(l){return l.entries.some(function(e){return e.name===x})})});
  if(all.length){
    if(all.indexOf(DATA.selectedEx)<0)DATA.selectedEx=all[0];
    h+='<div class="card"><h2>Evolución por ejercicio</h2><select onchange="DATA.selectedEx=this.value;render()">'+all.map(function(e){return'<option value="'+esc(e)+'"'+(e===DATA.selectedEx?' selected':'')+'>'+esc(e)+'</option>'}).join('')+'</select><select style="margin-top:8px" onchange="DATA.metric=this.value;render()">'+[['w','Peso máximo (kg)'],['vol','Volumen (kg×reps)'],['e1','1RM estimado']].map(function(m){return'<option value="'+m[0]+'"'+(m[0]===DATA.metric?' selected':'')+'>'+m[1]+'</option>'}).join('')+'</select>';
    var pts=pointsFor(DATA.selectedEx,DATA.metric);
    if(pts.length){
      var vals=pts.map(function(p){return p.val}),mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals),span=(mx-mn)||1,pr=bestPrev(DATA.selectedEx);
      h+='<div class="hint" style="margin-top:8px">Máx: <b>'+mx+'</b>'+(pr.e?' · 🏆 Mejor 1RM est.: <b>'+round1(pr.e)+'</b>':'')+'</div><svg class="ch" viewBox="0 0 300 130"><line x1="20" y1="100" x2="285" y2="100" stroke="var(--bd)"/>';
      var xy=pts.map(function(p,i){return{x:30+i*(250/Math.max(1,pts.length-1)),y:95-((p.val-mn)/span)*60,p:p}});
      if(xy.length>1)h+='<polyline fill="none" stroke="var(--ac)" stroke-width="2" points="'+xy.map(function(q){return q.x+','+q.y}).join(' ')+'"/>';
      xy.forEach(function(q){h+='<circle cx="'+q.x+'" cy="'+q.y+'" r="4" fill="var(--ac)"/><text x="'+q.x+'" y="'+(q.y-8)+'" font-size="10" fill="var(--tx)" text-anchor="middle">'+q.p.val+'</text><text x="'+q.x+'" y="114" font-size="8" fill="var(--mut)" text-anchor="middle">'+q.p.date+'</text>'});
      h+='</svg>';
    }
    h+='</div>';
  }
  return h+viewBody();
}
function lastBody(k){for(var i=DATA.body.length-1;i>=0;i--)if(parseFloat(DATA.body[i][k])>0)return DATA.body[i];return null}
function viewBody(){
  var b=DATA.body.slice().sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:0}),pesos=b.filter(function(e){return parseFloat(e.peso)>0}),L=pesos[pesos.length-1];

  }
  var c=lastBody('cintura'),a=lastBody('brazo');

function saveBody(){

   +'<p class="sec" style="margin-top:14px">COLOR DE ACENTO</p><div class="row" style="flex-wrap:wrap;gap:10px">'+ACCENTS.map(function(c){return'<div class="sw'+(curAccent()===c?' a':'')+'" style="background:'+c+'" onclick="applyAccent(\''+c+'\');render()"></div>'}).join('')+'</div>'
   +'<p class="sec" style="margin-top:14px">FUENTE</p><div class="tiles">'+FONTS.map(function(f){var cur=DATA.font||(DATA.theme==='editorial'?'editorial':'moderna');return'<div class="tile'+(cur===f[0]?' a':'')+'" onclick="setFont(\''+f[0]+'\');render()"><i class="fnt" data-font="'+f[0]+'" style="font-family:var(--fh)">Aa 123</i>'+f[1]+'</div>'}).join('')+'</div>'
   +'<p class="sec" style="margin-top:14px">TAMAÑO DE LA APP</p><div class="seg">'+[[0.9,'Compacto'],[1,'Normal'],[1.1,'Grande']].map(function(z){return'<button class="'+((DATA.zoom||1)===z[0]?'on':'')+'" onclick="setZoom('+z[0]+');render()">'+z[1]+'</button>'}).join('')+'</div></div>';
  h+='<div class="card"><p class="sec">META SEMANAL</p><div class="cfg"><span>Entrenamientos por semana</span>'+selOpt('goal',[1,2,3,4,5,6,7],'')+'</div><div class="hint" style="margin:0">Se usa en Progreso para la meta y la racha (semana de lunes a domingo).</div></div>';
  h+='<div class="card"><p class="sec">DESCANSO</p><div class="cfg"><span>Descanso por defecto</span>'+selOpt('rest',[45,60,90,120,180],' s')+'</div><div class="cfg"><span>Sonido al terminar</span>'+tg('sound')+'</div><div class="cfg"><span>Vibración</span>'+tg('vibrate')+'</div><div class="cfg"><span>Mantener pantalla encendida</span>'+tg('wake')+'</div><div class="cfg"><span>Aviso de duración</span>'+tg('alertOn')+'</div><div class="cfg"><span>Avisar a los</span>'+selOpt('alertMin',[45,60,75,90],' min')+'</div></div>';
  h+='<div class="card"><p class="sec">PROGRESIÓN</p><div class="cfg"><span>Incremento de carga</span>'+selOpt('inc',[1,1.25,2.5,5],' kg','parseFloat')+'</div><div class="cfg"><span>Reps por defecto (mín)</span><input type="number" value="'+S.repLo+'" onchange="setOpt(\'repLo\',parseInt(this.value)||8)"></div><div class="cfg"><span>Reps por defecto (máx)</span><input type="number" value="'+S.repHi+'" onchange="setOpt(\'repHi\',parseInt(this.value)||12)"></div></div>';
  h+='<div class="card"><p class="sec">CATÁLOGO DE EJERCICIOS</p><div class="cfg"><span>'+Object.keys(CAT).length+' ejercicios (hoja Ejercicios)</span><button class="sm" onclick="loadCatalog(true)">Actualizar</button></div></div>';
  h+='<div class="card"><p class="sec">DATOS Y SINCRONIZACIÓN</p><div class="cfg"><span>'+esc(DATA.sync||'☁')+'</span><span class="hint" style="margin:0">'+pend+' pendientes</span></div><button onclick="saveCloud();showToast(\'Sincronizando...\')">🔄 Forzar sincronización</button><a href="'+SPREADSHEET_URL+'" target="_blank"><button>📊 Abrir Google Sheets</button></a><button class="danger" onclick="clearHistory()">🗑 Borrar historial</button></div>';
  return h;
}

/* ---------- guardar sesión ---------- */
function saveSession(){
  stopTimer(true);
  var r=DATA.routines[DATA.rid],cardio=isCardio(r),entries=[],rows=[],prs=[],sid='s'+Date.now();
  r.ex.forEach(function(n,i){
    var bw=isBW(n);
    var sets=DATA.draft[i].filter(function(s){return cardio?+s.minutes>0:(+s.r>0&&(bw||(s.w!==''&&+s.w>=0)))});
    if(!sets.length)return;
    if(!cardio){
      sets=sets.map(function(s){return{w:parseFloat(s.w)||0,r:parseInt(s.r),restSec:s.restSec||0,done:true}});
      if(!isAsist(n)){
        var b=bestPrev(n),nw=Math.max.apply(null,sets.map(function(s){return +s.w})),ne=Math.max.apply(null,sets.map(function(s){return e1rm(+s.w,+s.r)}));
        if(b.e>0&&(nw>b.w||ne>b.e+0.01))prs.push(n+(nw>b.w?' ('+nw+' kg)':' (1RM est. '+round1(ne)+')'));
      }
    }
    entries.push({name:n,sets:sets});
    sets.forEach(function(s,idx){
      if(cardio)rows.push([DATA.date,r.name,n,idx+1,0,parseFloat(s.minutes),0,0,currentUser,sid]);
      else{var w=parseFloat(s.w),rp=parseInt(s.r);rows.push([DATA.date,r.name,n,idx+1,w,rp,s.restSec||0,w*rp,currentUser,sid])}
    });
  });
  if(!entries.length){showToast('Ingresa datos en al menos una serie.');return}
  var log={id:sid,date:DATA.date,routine:r.name,entries:entries};DATA.logs.push(log);cacheLogs();
  saveCloud();DATA.inSession=false;wakeOff();clearDraft();initDraft();
  sendRows(rows,log);
  DATA.tab='h';DATA.edit=null;render();window.scrollTo(0,0);
  showToast(prs.length?'🏆 ¡PR! '+prs.join(', '):'Sesión guardada',prs.length?6000:3000);
}

try{var _u=JSON.parse(localStorage.getItem('gymlog_ui')||'{}');DATA.theme=_u.theme==='editorial'?'editorial':'prooscuro';DATA.mode=_u.mode||'';DATA.accent=_u.accent||'';DATA.font=_u.font||'';DATA.zoom=_u.zoom||1}catch(e){}
applyUI();
window.addEventListener('online',function(){if(currentUser)flushPending(function(){saveCloud()})});
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
window.onload=loadLocal;
</script>
